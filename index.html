<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محفظة رداد</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#101820,#1d3547);
  color:white;
}

header{
  background:#0b1117;
  text-align:center;
  padding:22px;
  border-bottom:2px solid #d4af37;
}

header h1{
  margin:0;
  color:#d4af37;
}

.container{
  width:92%;
  max-width:500px;
  margin:25px auto;
}

.card{
  background:rgba(255,255,255,.08);
  padding:20px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

input,select,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:0;
  font-size:16px;
}

input,select{
  background:white;
  color:#111;
}

button{
  background:#d4af37;
  color:#111;
  font-weight:bold;
}

.logout{
  background:#8d2424;
  color:white;
}

.hidden{
  display:none;
}

.balance{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  color:#d4af37;
  margin:20px 0;
}

.info{
  line-height:2;
}

.error{
  color:#ff7777;
  margin-top:10px;
}

.success{
  color:#67e77b;
  margin-top:10px;
}

.transaction{
  background:rgba(0,0,0,.25);
  padding:12px;
  border-radius:12px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <h1>👑 محفظة رداد</h1>
  <p>نظام الردّاد الافتراضي</p>
</header>

<div class="container">

<!-- تسجيل الدخول -->
<div id="loginPage" class="card">
  <h2>🔐 تسجيل الدخول</h2>

  <input id="loginName" type="text"
         placeholder="الاسم الثلاثي">

  <input id="loginPassword" type="password"
         placeholder="كلمة المرور">

  <button onclick="login()">دخول</button>

  <div id="loginMessage"></div>

  <hr style="margin:20px 0;border-color:#555">

  <button onclick="showRegister()">
    إنشاء حساب جديد
  </button>
</div>


<!-- إنشاء حساب -->
<div id="registerPage" class="card hidden">
  <h2>📝 إنشاء حساب</h2>

  <input id="registerName" type="text"
         placeholder="الاسم الثلاثي">

  <input id="registerPassword" type="password"
         placeholder="كلمة المرور">

  <select id="province">
    <option value="">اختر المحافظة</option>
    <option>السهل الردادي الواسع</option>
    <option>نهر الرديد</option>
    <option>الجبال الثلجية</option>
    <option>الشرقية</option>
  </select>

  <select id="rank">
    <option value="">اختر الرتبة</option>
    <option>جندي سابق</option>
    <option>جندي في الجيش التحرير الردادي</
